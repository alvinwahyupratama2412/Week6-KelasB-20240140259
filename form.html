
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductHub - Buat Caption</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/form.js" defer></script>
</head>
<body>
    <header class="navbar">
        <h1>ProductHub</h1>
        <nav>
            <a href="index.html">Produk</a>
            <a href="form.html" class="active">Buat Caption</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-heading">
            <p class="subtitle">GENERATOR CAPTION</p>
            <h2>Buat Caption Produkmu</h2>
            <p>Isi data produk dan buat caption promosi secara otomatis.</p>
        </section>

        <form id="captionForm" class="form-card">
            <div class="form-group">
                <label for="productName">Nama Produk</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Contoh: Sepatu Sneakers"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="productPrice">Harga Produk (Rp)</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="Contoh: 150000"
                    min="1"
                    step="1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="productCategory">Kategori Produk</label>
                <select id="productCategory" required>
                    <option value="">Pilih kategori</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Elektronik">Elektronik</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Kecantikan">Kecantikan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label for="productDescription">Deskripsi Produk</label>
                <textarea
                    id="productDescription"
                    rows="4"
                    maxlength="250"
                    placeholder="Jelaskan keunggulan produk..."
                    required
                ></textarea>
            </div>

            <button type="submit" id="generateButton">
                Buat Caption
            </button>

            <p id="formMessage" role="status" aria-live="polite"></p>
        </form>

        <section id="resultSection" class="result-card" hidden>
            <h3>Hasil Caption</h3>
            <p id="captionResult"></p>
            <button type="button" id="copyButton">Salin Caption</button>
            <p id="copyMessage" role="status"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ProductHub | Tugas PPAW Week 6</p>
    </footer>
</body>
</html>
